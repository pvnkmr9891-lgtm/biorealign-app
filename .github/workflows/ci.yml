name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npm run typecheck

      # Report-only until the ~107 pre-existing lint errors are burned down —
      # then delete continue-on-error to make this blocking.
      - name: ESLint (report-only)
        run: npx eslint .
        continue-on-error: true
