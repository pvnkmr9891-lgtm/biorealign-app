# Golden flow: client logs in and lands on the client home screen.
# Required env vars (pass via `maestro test --env` or an env file — never
# commit real credentials): TEST_CLIENT_EMAIL, TEST_CLIENT_PASSWORD
appId: com.biorealign.app
---
- runFlow:
    file: ../auth/login.yaml
    env:
      EMAIL: "${TEST_CLIENT_EMAIL}"
      PASSWORD: "${TEST_CLIENT_PASSWORD}"
- assertVisible:
    id: "client-home-screen"
    timeout: 10000
