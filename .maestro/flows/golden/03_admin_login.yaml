# Golden flow: admin logs in and lands on the admin home screen.
# Required env vars: TEST_ADMIN_EMAIL, TEST_ADMIN_PASSWORD
appId: com.biorealign.app
---
- runFlow:
    file: ../auth/login.yaml
    env:
      EMAIL: "${TEST_ADMIN_EMAIL}"
      PASSWORD: "${TEST_ADMIN_PASSWORD}"
- assertVisible:
    id: "admin-home-screen"
    timeout: 10000
