# Golden flow (negative path): wrong password must show the native "Login
# failed" alert and must NOT navigate away from the login screen.
# Required env vars: TEST_CLIENT_EMAIL (a real account — password deliberately wrong)
appId: com.biorealign.app
---
- launchApp:
    clearState: false
- tapOn:
    id: "login-email-input"
- inputText: "${TEST_CLIENT_EMAIL}"
- tapOn:
    id: "login-password-input"
- inputText: "definitely-the-wrong-password"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible:
    text: "Login failed"
    timeout: 10000
- tapOn: "OK"
- assertVisible:
    id: "login-screen"
