# Golden flow: client sees fitness assessment scores their coach entered.
# Run 12_coach_enter_fitness_assessment.yaml first (or have equivalent
# scored assessment data already in place).
#
# Required env vars: TEST_CLIENT_EMAIL, TEST_CLIENT_PASSWORD
appId: com.biorealign.app
---
- runFlow:
    file: ../auth/login.yaml
    env:
      EMAIL: "${TEST_CLIENT_EMAIL}"
      PASSWORD: "${TEST_CLIENT_PASSWORD}"
- assertVisible:
    id: "client-home-screen"
    timeout: 10000
- tapOn:
    id: "bottom-tab-menu"
- tapOn:
    id: "drawer-item-fitness-assessment"
- assertVisible:
    id: "fitness-assessment-screen"
    timeout: 10000
- assertVisible:
    text: "Strength"
    timeout: 10000
